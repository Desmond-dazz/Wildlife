<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlife</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="contact-header">
      <div class="container header-flex">
        <p class="logo">Wildlife</p>
        <ul class="main-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <!-- Hero text -->
    <section class="hero contact-hero">
      <div class="container">
        <h1 class="hero-heading">
          Inspired changemakers,<span>launching</span> critical initiatives
          powered by purpose
        </h1>
      </div>
    </section>

    <!-- Contact Us -->
    <section class="contact-details">
      <div class="container contact-details-flex">
        <div class="contact-info">
          <h3>Contact Us</h3>
          <p>
            Have a question? Leave your information below and we will get back
            to you as soon as possible.
          </p>
        </div>
        <form name="contact" netlify>
          <div class="form-group">
            <input
              type="text"
              name="first-name"
              class="first-name"
              placeholder="First Name"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="text"
              name="last-name"
              class="last-name"
              placeholder="Last Name"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="email"
              name="email"
              class="last-name"
              placeholder="Email"
              required
            />
          </div>
          <textarea
            class="message"
            name="message"
            placeholder="Message"
            required
          ></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <div class="container footer-flex">
        <p class="logo">Wildlife</p>
        <!-- Conact Us -->
        <div class="contact-us">
          <h4>Contact Us</h4>
          <ul>
            <li>(678) 245-564</li>
            <li>10 Main st Maxwell</li>
          </ul>
        </div>

        <!-- Follow Us -->
        <div class="follow-us">
          <h4>Follow Us</h4>
          <ul>
            <li><i class="fa-brands fa-facebook"></i></li>
            <li><i class="fa-brands fa-twitter"></i></li>
            <li><i class="fa-brands fa-square-instagram"></i></li>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
