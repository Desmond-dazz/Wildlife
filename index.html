<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlife</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container header-flex">
        <p class="logo">Wildlife</p>
        <ul class="main-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <!-- Hero text -->
    <section class="hero">
      <div class="container">
        <h1 class="hero-heading">The Wildlife & <span>Conservation</span></h1>
        <p class="hero-description">
          Our mission is to capture and protect the raw, untamed beauty of our
          planet. We are entirely inspired and driven by nature.
        </p>
      </div>
    </section>

    <!-- Gallery -->
    <section class="gallery-section">
      <div class="container gallery-flex">
        <div class="gallery-item">
          <img src="./images/1. A roaring lion.jpg" alt="Lion" />
        </div>
        <div class="gallery-item">
          <img src="./images/2. breaching whale.jpg" alt="Whale" />
        </div>
        <div class="gallery-item">
          <img src="./images/3. soaring bald eagle.jpg" alt="Eagle" />
        </div>
        <div class="gallery-item">
          <img src="./images/4. A cheetah sprinting.jpg" alt="Cheetah" />
        </div>
        <div class="gallery-item">
          <img src="./images/5. elephant.jpg" alt="Elaphant" />
        </div>
        <div class="gallery-item">
          <img src="./images/6. a green tree frog.jpg" alt="Frog" />
        </div>
        <div class="gallery-item">
          <img src="./images/7. A giant panda eating bamboo.jpg" alt="Panga" />
        </div>
        <div class="gallery-item">
          <img src="./images/8. a wolf howling.jpg" alt="Wolf" />
        </div>
        <div class="gallery-item">
          <img src="./images/9. a sea turtle swimming.jpg" alt="Turtle" />
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <div class="container footer-flex">
        <p class="logo">Wildlife</p>
        <!-- Conact Us -->
        <div class="contact-us">
          <h4>Contact Us</h4>
          <ul>
            <li>(678) 245-564</li>
            <li>10 Main st Maxwell</li>
          </ul>
        </div>

        <!-- Follow Us -->
        <div class="follow-us">
          <h4>Follow Us</h4>
          <ul>
            <li><i class="fa-brands fa-facebook"></i></li>
            <li><i class="fa-brands fa-twitter"></i></li>
            <li><i class="fa-brands fa-square-instagram"></i></li>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
